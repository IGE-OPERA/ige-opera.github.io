{% comment %}
  Climate warming stripes strip shown at the bottom of the home hero.
  The SVG is generated by scripts/make_warming_stripes.py from NASA GISTEMP
  global annual mean anomalies (public domain data).
{% endcomment %}
<div class="opera-hero__stripes">
  <img src="{{ '/assets/images/home/climate-stripes.svg' | relative_url }}"
       alt="Warming stripes: global temperature change 1880–2025, from blue (cooler) to red (warmer)"
       loading="lazy">
  <span class="opera-hero__stripes-caption">Global temperature change, 1880–2025 — NASA GISTEMP v4</span>
</div>
