<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Schematic of hybrid modelling: a physical model exchanging gradients and learned terms with a neural network component">
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37699E"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A7B8"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <!-- Physical model panel -->
  <rect x="45" y="70" width="205" height="185" rx="10" fill="#F2F6FA" stroke="#37699E" stroke-width="1.6"/>
  <text x="147" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#24313C">Physical model</text>
  <text x="147" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#37699E">&#8706;u/&#8706;t = F(u, &#952;)</text>

  <!-- stylised grid + flow lines inside physical model -->
  <g stroke="#C9D8E4" stroke-width="1" fill="none">
    <path d="M65 150 h165"/>
    <path d="M65 175 h165"/>
    <path d="M65 200 h165"/>
    <path d="M65 225 h165"/>
    <path d="M100 145 v85"/>
    <path d="M140 145 v85"/>
    <path d="M180 145 v85"/>
  </g>
  <g stroke="#578BBD" stroke-width="2.2" fill="none" opacity="0.9">
    <path d="M62 160 C 90 150, 110 172, 138 162 S 190 146, 215 158"/>
    <path d="M62 192 C 90 182, 110 204, 138 194 S 190 178, 215 190"/>
    <path d="M62 224 C 90 214, 110 236, 138 226 S 190 210, 215 222"/>
  </g>

  <!-- Neural component panel -->
  <rect x="350" y="70" width="205" height="185" rx="10" fill="#FBFCFD" stroke="#94A7B8" stroke-width="1.6"/>
  <text x="452" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#24313C">Neural component</text>

  <!-- small neural network -->
  <g fill="#ffffff" stroke="#578BBD" stroke-width="1.6">
    <circle cx="395" cy="140" r="9"/>
    <circle cx="395" cy="175" r="9"/>
    <circle cx="395" cy="210" r="9"/>
    <circle cx="452" cy="158" r="9"/>
    <circle cx="452" cy="193" r="9"/>
    <circle cx="509" cy="140" r="9"/>
    <circle cx="509" cy="175" r="9"/>
    <circle cx="509" cy="210" r="9"/>
  </g>
  <g stroke="#A8C3D8" stroke-width="1.3">
    <line x1="404" y1="140" x2="443" y2="158"/>
    <line x1="404" y1="175" x2="443" y2="158"/>
    <line x1="404" y1="175" x2="443" y2="193"/>
    <line x1="404" y1="210" x2="443" y2="193"/>
    <line x1="404" y1="140" x2="443" y2="193"/>
    <line x1="404" y1="210" x2="443" y2="158"/>
    <line x1="461" y1="158" x2="500" y2="140"/>
    <line x1="461" y1="158" x2="500" y2="175"/>
    <line x1="461" y1="193" x2="500" y2="175"/>
    <line x1="461" y1="193" x2="500" y2="210"/>
  </g>

  <!-- top arrow: gradients flow back -->
  <path d="M355 118 C 315 96, 290 96, 250 118" fill="none" stroke="#37699E" stroke-width="2" marker-end="url(#arrow-b)"/>
  <text x="302" y="92" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12.5" fill="#37699E">&#8711; gradients</text>

  <!-- bottom arrow: learned law goes in -->
  <path d="M250 208 C 290 230, 315 230, 355 208" fill="none" stroke="#94A7B8" stroke-width="2" marker-end="url(#arrow-g)"/>
  <text x="302" y="248" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="12.5" fill="#5A6B7A">learned terms</text>

  <!-- caption band -->
  <text x="300" y="303" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#24313C">hybrid &#183; differentiable &#183; end-to-end</text>
  <path d="M190 320 h220" stroke="#C9D8E4" stroke-width="1.5"/>
  <text x="300" y="348" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="13" fill="#5A6B7A">one objective, one model, both worlds</text>
</svg>
